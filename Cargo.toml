[package]
name = "memo-app-ui"
version = "2.0.0"
edition = "2021"

# v2: a minimal web client for the MEMO protocol (connect an external wallet, mint).
# The previous app (embedded wallet, chat, forum, blog, projects) is kept in v1/ for reference.
[dependencies]
leptos = { version = "0.6.15", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Storage",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
gloo-utils = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1.7"
wasm-logger = "0.2"
log = "0.4"
getrandom = { version = "0.2", features = ["js"] }
sha2 = "0.10"
base64 = "0.13"
bincode = "1.3"
solana-sdk = "1.18.26"
spl-associated-token-account = { version = "2.0.0", features = ["no-entrypoint"] }
spl-memo = { version = "4.0.0", features = ["no-entrypoint"] }
