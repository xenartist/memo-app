    <!-- Backpack signs a web3.js Transaction object, not raw bytes -->
    <script src="https://unpkg.com/@solana/web3.js@1.98.0/lib/index.iife.min.js"></script>
    <script>
      window.MemoBackpack = {
        signTransaction: async function (txBase64) {
          const bytes = Uint8Array.from(atob(txBase64), (c) => c.charCodeAt(0));
          const tx = window.solanaWeb3.Transaction.from(bytes);
          const signed = await window.backpack.signTransaction(tx);
          const out = signed.serialize();
          let bin = '';
          for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
          return btoa(bin);
        },
      };
    </script>
